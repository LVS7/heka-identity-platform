<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TrustCo Console</title>
    <link rel="stylesheet" href="../../web/public/app.css" />
    <style>
      .issuer {
        margin-top: 18px;
        display: grid;
        gap: 6px;
        font-size: 12.5px;
      }
      .issuer div {
        display: grid;
        grid-template-columns: 120px 1fr;
        gap: 12px;
      }
      .issuer span:first-child {
        color: var(--muted);
      }
      .tile {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 16px 18px;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px 18px;
        align-items: center;
      }
      .tile.revoked {
        border-color: rgba(248, 113, 113, 0.45);
      }
      .tile h3 {
        margin: 0 0 3px;
        font-size: 15px;
      }
      .effect {
        grid-column: 1 / -1;
        color: var(--muted);
        font-size: 12.5px;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <h1>TrustCo Console</h1>
        <p class="subtitle">Certification body — credential lifecycle</p>
      </div>
    </header>

    <main>
      <p class="note">
        Revoking here updates the published status list. Any relying party reading it — including
        the Trust Lens and the agent — sees the change on its next check. Nothing is republished,
        and the registry is not involved.
      </p>

      <div id="tiles" class="cards"></div>

      <div class="issuer" id="issuer"></div>
    </main>

    <script src="./console.js"></script>
  </body>
</html>
